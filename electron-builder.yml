appId: com.muyian.workbench
productName: Workbench
copyright: Copyright © 2026 Workbench

directories:
  output: dist
  buildResources: build

# 直接用 npm 已经装好的 Electron 发行包，避免打包时再从 GitHub 下一份 115MB
electronDist: node_modules/electron/dist

# better-sqlite3 v13 在 npm 包里自带全平台 prebuilds（node_modules/better-sqlite3/prebuilds/），
# 不需要也不能重编译 —— 这台机器没有 VS 工具链，electron-builder 默认的 npm rebuild 会直接失败。
npmRebuild: false

# 渲染层已经被 Vite 打进 out/renderer，主进程依赖 electron、Node 内置模块与 better-sqlite3
# （读取 ZCode 本地用量库，见 src/main/token-usage.ts）；
# node_modules 会被 electron-builder 默认全量塞进 asar，对纯 Vite 打包的应用是 60MB+ 的死重。
files:
  - out/**
  - package.json
  - '!node_modules/**'
  # better-sqlite3 v13 自带全平台 prebuilds，无需编译：只带运行时用得到的 JS 与当前平台二进制
  - 'node_modules/better-sqlite3/lib/**'
  - 'node_modules/better-sqlite3/prebuilds/win32-x64.node'
  - 'node_modules/better-sqlite3/package.json'

# .node 二进制不能躺在 asar 里：解包到 app.asar.unpacked，运行时 require 由 Electron 重定向
asarUnpack:
  - 'node_modules/better-sqlite3/prebuilds/**'

# 内置壁纸：打包后落在 resourcesPath/backgrounds 下（主进程按这个位置读，见 src/main/wallpapers.ts）。
# 只带位图，出图母版（resources/masters 里的 svg）不进安装包。
extraResources:
  - from: resources/backgrounds
    to: backgrounds
    filter:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.bmp'
      - '**/*.gif'

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Workbench
  # 卸载时保留用户数据（workbench-data.json 里的项目列表），避免误删配置
  deleteAppDataOnUninstall: false
