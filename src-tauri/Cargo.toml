[package]
name = "workbench"
version = "0.1.0"
description = "前端项目控制台"
authors = ["muyian"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
zstd = "0.13"
uuid = { version = "1", features = ["v4"] }

# 开发档位：只留行号级调试信息。Windows 上链接时间的大头就是调试信息，
# 这一条直接决定改一行之后要等多久（见 docs/dev-notes/tauri-migration.md）。
[profile.dev]
debug = "line-tables-only"

# 发布档位：体积优先。strip 掉符号、LTO、panic=abort 都是为了安装包能小。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
