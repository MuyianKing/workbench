<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>命令卡片 · 设计稿</title>
    <style>
      /* ============================================================
         设计令牌（自 src/renderer/src/styles/tokens.css 原样抄来）
         ============================================================ */
      :root {
        --bg-canvas: #edeff2;
        --bg-surface: #ffffff;
        --bg-subtle: #f5f6f8;
        --bg-inset: #e8eaee;
        --border: #e1e4e9;
        --border-strong: #c9cfd8;
        --ink: #11151b;
        --ink-2: #4e5866;
        --ink-3: #848e9c;
        --term-bg: #11151b;
        --term-ink: #c7d0db;
        --term-link: #3fb37f;
        --st-idle: #9ba4b0;
        --st-run: #c77f0a;
        --st-ok: #0b8a57;
        --st-fail: #ce3f3f;
        --st-run-soft: #fdf4e3;
        --st-ok-soft: #e8f5ee;
        --st-fail-soft: #fbecec;
        --st-idle-soft: #f0f2f5;
        --font-ui: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          'Hiragino Sans GB', sans-serif;
        --font-mono: 'Cascadia Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, 'SF Mono',
          ui-monospace, monospace;
        --fs-meta: 12px;
        --fs-micro: 10.5px;
        --r-sm: 6px;
        --r-md: 9px;
        --r-lg: 12px;
        --r-pill: 999px;
        --shadow-card: 0 1px 2px rgba(17, 21, 27, 0.05), 0 1px 1px rgba(17, 21, 27, 0.03);
      }

      :root[data-theme='dark'] {
        --bg-canvas: #151a21;
        --bg-surface: #1b212a;
        --bg-subtle: #20262f;
        --bg-inset: #262d37;
        --border: #2b323d;
        --border-strong: #3a424f;
        --ink: #e8edf4;
        --ink-2: #b3bdc9;
        --ink-3: #7f8a98;
        --term-bg: #0f1319;
        --st-idle: #6b7787;
        --st-run: #e0a23a;
        --st-ok: #3fb37f;
        --st-fail: #ef7373;
        --st-run-soft: rgba(224, 162, 58, 0.14);
        --st-ok-soft: rgba(63, 179, 127, 0.14);
        --st-fail-soft: rgba(239, 115, 115, 0.14);
        --st-idle-soft: rgba(107, 119, 135, 0.16);
        --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 1px rgba(0, 0, 0, 0.3);
      }

      /* ============================================================
         页面外壳
         ============================================================ */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 32px 36px 56px;
        background: var(--bg-canvas);
        color: var(--ink);
        font-family: var(--font-ui);
        font-size: 13px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .mono {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
      }

      .docs__head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        max-width: 1180px;
        margin: 0 auto 28px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--border);
      }

      .docs__title {
        margin: 0 0 6px;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .docs__desc {
        margin: 0;
        max-width: 720px;
        color: var(--ink-2);
      }

      .docs__desc b {
        color: var(--ink);
        font-weight: 600;
      }

      .docs__toggle {
        flex: none;
        padding: 6px 12px;
        border: 1px solid var(--border-strong);
        border-radius: var(--r-sm);
        background: var(--bg-surface);
        color: var(--ink-2);
        font-family: inherit;
        font-size: var(--fs-micro);
        cursor: pointer;
      }

      .docs__toggle:hover {
        border-color: var(--ink);
        color: var(--ink);
      }

      .opt {
        display: block;
        max-width: 1180px;
        margin: 0 auto;
        padding: 22px 0;
        border-bottom: 1px solid var(--border);
      }

      .opt:last-child {
        border-bottom: 0;
      }

      .opt__meta {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 14px;
      }

      .opt__tag {
        display: inline-grid;
        place-items: center;
        align-self: center;
        width: 20px;
        height: 20px;
        border-radius: var(--r-sm);
        background: var(--ink);
        color: var(--bg-surface);
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
      }

      .opt__name {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .opt__note {
        margin: 0;
        color: var(--ink-2);
        font-size: var(--fs-meta);
      }

      .opt__list {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 22px;
        margin: 0 0 0 30px;
        padding: 0;
        list-style: none;
        color: var(--ink-3);
        font-size: var(--fs-micro);
      }

      .opt__list .plus {
        color: var(--st-ok);
      }

      .opt__list .minus {
        color: var(--st-fail);
      }

      .opt__stage {
        display: flex;
        align-items: flex-start;
        gap: 20px;
        flex-wrap: wrap;
      }

      /* ============================================================
         卡片外壳（与项目里的 .panel 一致）
         ============================================================ */
      .panel {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 16px;
        padding-bottom: 8px;
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-card);
        overflow: hidden;
      }

      .panel--wide {
        width: 690px;
        height: 138px;
      }

      .panel--narrow {
        width: 300px;
        height: 232px;
      }

      .panel__head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex: none;
      }

      .eyebrow {
        font-family: var(--font-mono);
        font-size: var(--fs-micro);
        font-weight: 500;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      .panel__add {
        position: absolute;
        top: 12px;
        right: 12px;
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--ink-3);
        font-size: 13px;
        cursor: pointer;
      }

      .panel__add:hover {
        color: var(--ink);
      }

      .panel__body {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
      }

      .panel__label {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--ink-3);
        opacity: 0.75;
        margin: 0 0 6px;
      }

      .panel__cap {
        margin: 8px 0 0;
        font-family: var(--font-mono);
        font-size: 10px;
        line-height: 1.6;
        color: var(--ink-3);
        opacity: 0.85;
      }

      .stage__col {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .ico svg {
        display: block;
      }

      /* 图标按钮：无边框幽灵按钮，常态灰、悬停浮底 */
      .ico {
        display: grid;
        place-items: center;
        flex: none;
        width: 22px;
        height: 22px;
        padding: 0;
        border: 0;
        border-radius: var(--r-sm);
        background: transparent;
        color: var(--ink-2);
        font-size: 13px;
        line-height: 1;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }

      .ico:hover {
        background: var(--bg-surface);
        color: var(--ink);
      }

      .ico--off {
        opacity: 0.35;
        cursor: default;
      }

      .ico--off:hover {
        background: transparent;
        color: var(--ink-2);
      }

      .ico--stop {
        color: var(--st-run);
      }

      .ico--stop:hover {
        background: var(--st-run-soft);
        color: var(--st-run);
      }

      .acts {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      /* 悬停态演示：静态图里也看得出来 */
      [data-demo='hover'] {
        background: var(--bg-inset) !important;
      }

      [data-demo='hover'] .hover-only {
        opacity: 1 !important;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }

      /* ============================================================
         A · 紧凑卡片格
         ============================================================ */
      .a-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
        gap: 6px;
        align-content: start;
      }

      .a {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 7px 8px;
        border-radius: var(--r-md);
        background: var(--bg-subtle);
        transition: background 0.15s ease;
      }

      .a:hover {
        background: var(--bg-inset);
      }

      .a__top {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .dot {
        flex: none;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--st-idle);
        opacity: 0.45;
      }

      [data-state='run'] .dot {
        background: var(--st-run);
        opacity: 1;
        animation: pulse 1.4s ease-in-out infinite;
      }

      [data-state='external'] .dot {
        background: var(--st-run);
        opacity: 1;
      }

      [data-state='fail'] .dot {
        background: var(--st-fail);
        opacity: 1;
      }

      .a__name {
        flex: 1;
        min-width: 0;
        font-size: var(--fs-meta);
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .a__port {
        flex: none;
        font-family: var(--font-mono);
        font-size: var(--fs-micro);
        color: var(--ink-3);
      }

      /* ============================================================
         B · 单行胶囊
         ============================================================ */
      .b-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-content: flex-start;
      }

      .b {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 8px;
        border: 1px solid transparent;
        border-radius: var(--r-pill);
        background: var(--bg-subtle);
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .b:hover {
        background: var(--bg-inset);
      }

      .b[data-state='run'],
      .b[data-state='external'] {
        background: var(--st-run-soft);
      }

      .b[data-state='fail'] {
        border-color: var(--st-fail-soft);
      }

      .b__name {
        font-size: var(--fs-meta);
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--ink);
      }

      .b__port {
        font-family: var(--font-mono);
        font-size: var(--fs-micro);
        color: var(--ink-3);
      }

      /* 右侧固定留一格给「更多」，避免悬停时胶囊变宽 */
      .b__more {
        display: grid;
        place-items: center;
        flex: none;
        width: 14px;
        height: 14px;
        margin-right: -2px;
        border-radius: 50%;
        color: var(--ink-3);
        font-size: 12px;
        line-height: 1;
        opacity: 0;
        transition: opacity 0.15s ease;
      }

      .b:hover .b__more {
        opacity: 1;
      }

      .b__more:hover {
        background: var(--bg-surface);
        color: var(--ink);
      }

      /* ============================================================
         C · 单行行表
         ============================================================ */
      .c-list {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .c {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 27px;
        padding: 0 4px 0 8px;
        border-radius: var(--r-sm);
        transition: background 0.15s ease;
      }

      .c:hover {
        background: var(--bg-subtle);
      }

      .c__name {
        flex: none;
        width: 92px;
        font-size: var(--fs-meta);
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .c__cmd {
        flex: 1;
        min-width: 0;
        font-family: var(--font-mono);
        font-size: var(--fs-micro);
        color: var(--ink-3);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .c__port {
        flex: none;
        font-family: var(--font-mono);
        font-size: var(--fs-micro);
        color: var(--ink-3);
      }

      .c__state {
        flex: none;
        width: 62px;
        text-align: right;
        font-size: var(--fs-micro);
        color: var(--ink-3);
      }

      .c__state[data-state='run'],
      .c__state[data-state='external'] {
        color: var(--st-run);
      }

      .c__state[data-state='fail'] {
        color: var(--st-fail);
      }

      .c .acts {
        flex: none;
        opacity: 0;
        transition: opacity 0.15s ease;
      }

      .c:hover .acts {
        opacity: 1;
      }

      /* ============================================================
         D · 状态色条卡
         ============================================================ */
      .d-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
        gap: 6px;
        align-content: start;
      }

      .d {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 7px 8px 7px 12px;
        border-radius: var(--r-md);
        background: var(--bg-subtle);
        transition: background 0.15s ease;
      }

      .d::before {
        content: '';
        position: absolute;
        inset: 5px auto 5px 0;
        width: 3px;
        border-radius: 0 2px 2px 0;
        background: var(--st-idle);
        opacity: 0.5;
      }

      .d[data-state='run']::before,
      .d[data-state='external']::before {
        background: var(--st-run);
        opacity: 1;
      }

      .d[data-state='fail']::before {
        background: var(--st-fail);
        opacity: 1;
      }

      .d:hover {
        background: var(--bg-inset);
      }

      .d__row {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .d__name {
        flex: 1;
        min-width: 0;
        font-size: var(--fs-meta);
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--ink);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .d__port {
        flex: none;
        font-family: var(--font-mono);
        font-size: var(--fs-micro);
        color: var(--ink-3);
      }

      .d__cmd {
        min-width: 0;
        font-family: var(--font-mono);
        font-size: var(--fs-micro);
        color: var(--ink-3);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .d .acts {
        position: absolute;
        top: 5px;
        right: 6px;
        opacity: 0;
        transition: opacity 0.15s ease;
      }

      .d:hover .acts {
        opacity: 1;
      }

      /* 悬停时把端口让开，免得跟按钮叠在一起 */
      .d:hover .d__port {
        opacity: 0;
      }

      /* ============================================================
         E · 终端命令行
         ============================================================ */
      .e-list {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .e {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 26px;
        padding: 0 6px 0 8px;
        border-radius: var(--r-sm);
        font-family: var(--font-mono);
        font-size: 11.5px;
        transition: background 0.15s ease;
      }

      .e:hover {
        background: var(--bg-subtle);
      }

      .e__prompt {
        flex: none;
        color: var(--ink-3);
      }

      .e[data-state='run'] .e__prompt,
      .e[data-state='external'] .e__prompt {
        color: var(--st-run);
      }

      .e[data-state='fail'] .e__prompt {
        color: var(--st-fail);
      }

      .e__cmd {
        flex: 1;
        min-width: 0;
        color: var(--ink-2);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .e__port {
        flex: none;
        color: var(--ink-3);
      }

      .e .acts {
        flex: none;
        gap: 8px;
        opacity: 0;
        transition: opacity 0.15s ease;
      }

      .e:hover .acts {
        opacity: 1;
      }

      .e .link {
        font-family: var(--font-ui);
        font-size: var(--fs-micro);
        color: var(--ink-3);
        cursor: pointer;
      }

      .e .link:hover {
        color: var(--ink);
      }

      .e .link--stop {
        color: var(--st-run);
      }
    </style>
  </head>

  <body>
    <header class="docs__head">
      <div>
        <h1 class="docs__title">命令卡片 · 5 种设计方向</h1>
        <p class="docs__desc">
          真尺寸与真令牌：左边是<b>你现在的布局</b>（中间栏，约 690px 宽 / 138px 高），
          右边是同一方案放进<b>窄栏</b>（300px）的样子。鼠标移上去可以试悬停态；
          每条里<b>高亮的那一条</b>就是悬停时的模样。数据是假的，五种状态都有：
          运行中 / 未运行 / 外部启动 / 无端口 / 已退出。
        </p>
      </div>
      <button class="docs__toggle" id="toggle">切换明暗</button>
    </header>

    <main id="options"></main>

    <script>
      const commands = [
        { name: 'dsh web', cmd: 'npx @deepseek-ai/dsh web', port: 3000, state: 'run' },
        { name: 'blog dev', cmd: 'pnpm dev --host', port: 5173, state: 'idle' },
        { name: 'ui preview', cmd: 'pnpm preview --port 8080', port: 8080, state: 'external' },
        { name: '数据同步', cmd: 'node scripts/sync.js', state: 'idle' },
        { name: 'seed db', cmd: 'npm run seed', state: 'fail' }
      ]

      const stateText = { idle: '未运行', run: '运行中', external: '运行中', fail: '已退出' }

                  const svg = (d) =>
        `<svg viewBox="0 0 1024 1024" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>`
      const I = {
        play: svg("M512 64a448 448 0 1 1 0 896 448 448 0 0 1 0-896m0 832a384 384 0 0 0 0-768 384 384 0 0 0 0 768m-48-247.616L668.608 512 464 375.616zm10.624-342.656 249.472 166.336a48 48 0 0 1 0 79.872L474.624 718.272A48 48 0 0 1 400 678.336V345.6a48 48 0 0 1 74.624-39.936z"),
        pause: svg("M512 64a448 448 0 1 1 0 896 448 448 0 0 1 0-896m0 832a384 384 0 0 0 0-768 384 384 0 0 0 0 768m-96-544q32 0 32 32v256q0 32-32 32t-32-32V384q0-32 32-32m192 0q32 0 32 32v256q0 32-32 32t-32-32V384q0-32 32-32"),
        search: svg("m795.904 750.72 124.992 124.928a32 32 0 0 1-45.248 45.248L750.656 795.904a416 416 0 1 1 45.248-45.248zM480 832a352 352 0 1 0 0-704 352 352 0 0 0 0 704"),
        more: svg("M176 416a112 112 0 1 1 0 224 112 112 0 0 1 0-224m336 0a112 112 0 1 1 0 224 112 112 0 0 1 0-224m336 0a112 112 0 1 1 0 224 112 112 0 0 1 0-224"),
        plus: svg("M480 480V128a32 32 0 0 1 64 0v352h352a32 32 0 1 1 0 64H544v352a32 32 0 1 1-64 0V544H128a32 32 0 0 1 0-64z"),
        loading: svg("M512 64a32 32 0 0 1 32 32v192a32 32 0 0 1-64 0V96a32 32 0 0 1 32-32m0 640a32 32 0 0 1 32 32v192a32 32 0 1 1-64 0V736a32 32 0 0 1 32-32m448-192a32 32 0 0 1-32 32H736a32 32 0 1 1 0-64h192a32 32 0 0 1 32 32m-640 0a32 32 0 0 1-32 32H96a32 32 0 0 1 0-64h192a32 32 0 0 1 32 32M195.2 195.2a32 32 0 0 1 45.248 0L376.32 331.008a32 32 0 0 1-45.248 45.248L195.2 240.448a32 32 0 0 1 0-45.248m452.544 452.544a32 32 0 0 1 45.248 0L828.8 783.552a32 32 0 0 1-45.248 45.248L647.744 692.992a32 32 0 0 1 0-45.248M828.8 195.264a32 32 0 0 1 0 45.184L692.992 376.32a32 32 0 0 1-45.248-45.248l135.808-135.808a32 32 0 0 1 45.248 0m-452.544 452.48a32 32 0 0 1 0 45.248L240.448 828.8a32 32 0 0 1-45.248-45.248l135.808-135.808a32 32 0 0 1 45.248 0"),
      }

      const play = () => `<span class="ico">${I.play}</span>`
      const pause = () => `<span class="ico ico--stop">${I.pause}</span>`
      const search = () => `<span class="ico">${I.search}</span>`
      const searchOff = () => `<span class="ico ico--off">${I.search}</span>`
      const more = () => `<span class="ico">${I.more}</span>`

      const acts = (c) =>
        `<span class="acts hover-only">${
          c.state === 'run' || c.state === 'external' ? pause() : play()
        }${c.port ? search() : searchOff()}${more()}</span>`

      const dot = (c) => `<span class="dot"></span>`
      const port = (c) => (c.port ? `<span class="port">:${c.port}</span>` : '')

      // A · 紧凑卡片格
      const tileA = (c, i) => `
        <div class="a" data-state="${c.state}" ${i === 2 ? "data-demo='hover'" : ''}>
          <div class="a__top">${dot(c)}<span class="a__name">${c.name}</span>${
            c.port ? `<span class="a__port">:${c.port}</span>` : ''
          }</div>
          ${acts(c)}
        </div>`

      // B · 单行胶囊
      const chipB = (c, i) => `
          <div class="b" data-state="${c.state}" ${i === 2 ? "data-demo='hover'" : ''}>
          ${dot(c)}<span class="b__name">${c.name}</span>${
            c.port ? `<span class="b__port">:${c.port}</span>` : ''
          }<span class="b__more hover-only">${I.more}</span>
        </div>`

      // C · 单行行表
      const rowC = (c, i) => `
        <div class="c" ${i === 2 ? "data-demo='hover'" : ''}>
          ${dot(c)}<span class="c__name">${c.name}</span>
          <span class="c__cmd">${c.cmd}</span>
          ${c.port ? `<span class="c__port">:${c.port}</span>` : ''}
          <span class="c__state" data-state="${c.state}">${stateText[c.state]}</span>
          ${acts(c)}
        </div>`

      // D · 状态色条卡
      const cardD = (c, i) => `
        <div class="d" data-state="${c.state}" ${i === 2 ? "data-demo='hover'" : ''}>
          <div class="d__row">${dot(c)}<span class="d__name">${c.name}</span>${
            c.port ? `<span class="d__port">:${c.port}</span>` : ''
          }</div>
          <div class="d__cmd">${c.cmd}</div>
          ${acts(c)}
        </div>`

      // E · 终端命令行
      const lineE = (c, i) => `
        <div class="e" data-state="${c.state}" ${i === 2 ? "data-demo='hover'" : ''}>
          <span class="e__prompt">❯</span>
          <span class="e__cmd">${c.cmd}</span>
          ${c.port ? `<span class="e__port">:${c.port}</span>` : ''}
          <span class="acts hover-only">
            <span class="link ${c.state === 'run' || c.state === 'external' ? 'link--stop' : ''}">${
              c.state === 'run' || c.state === 'external' ? '停止' : '启动'
            }</span>
            ${c.port ? '<span class="link">检测</span>' : ''}
            <span class="link">${I.more}</span>
          </span>
        </div>`

      const options = [
        {
          tag: 'A',
          name: '紧凑卡片格',
          note: '一条命令一个小格子，两行：名称 + 端口 / 三个图标按钮。',
          plus: ['状态点 + 启停按钮都能一眼看到', '一排 6 个，5 条全在一屏里'],
          minus: ['命令行原文要靠悬停提示', '一格里三个图标，重复得比较多'],
          wideCap: '一排 6 个，5 条全看得见',
          narrowCap: '两列，4 条占两行',
          render: tileA,
          listClass: 'a-list'
        },
        {
          tag: 'B',
          name: '单行胶囊',
          note: '一条命令一个胶囊，整颗点一下就启停，⋯ 悬停才出现。',
          plus: ['最轻，视觉噪点最少', '一排能放 8～10 个'],
          minus: ['命令行原文、状态文字都看不见', '点击即启停，容易误触'],
          wideCap: '一行排得下 5 条还有富余',
          narrowCap: '胶囊折成两行',
          render: chipB,
          listClass: 'b-list'
        },
        {
          tag: 'C',
          name: '单行行表',
          note: '一行一条，名称 / 命令行 / 端口 / 状态各占一列，操作悬停出现。',
          plus: ['信息最全，扫读性最好（像一张小表）', '宽卡片天然适合它'],
          minus: ['一行只放一条，密度靠行高换', '操作藏在悬停里'],
          wideCap: '只放得下 3 行，其余要滚',
          narrowCap: '卡高一些，正好放得下 8 行',
          render: rowC,
          listClass: 'c-list'
        },
        {
          tag: 'D',
          name: '状态色条卡',
          note: '与项目卡同一套视觉语言：左边一条状态色带，名称 + 命令行两行。',
          plus: ['状态最醒目，和项目卡连成一体', '命令行可见'],
          minus: ['占地最大，一排 3 个', '窄栏里要折行'],
          wideCap: '一排 3 个，第二排立刻被裁掉',
          narrowCap: '一列，放得下 4 个',
          render: cardD,
          listClass: 'd-list'
        },
        {
          tag: 'E',
          name: '终端命令行',
          note: '每条就是一行终端命令（❯ 提示符），操作是悬停出现的文字。',
          plus: ['与底部终端同一套语言，开发者味最足', '命令行原文天然可见'],
          minus: ['中文名放进 mono 会有点怪', '文字操作比图标慢一点'],
          wideCap: '只放得下 3 行，其余要滚',
          narrowCap: '放得下 8 行',
          render: lineE,
          listClass: 'e-list'
        }
      ]

      const body = (o) => `
        <div class="panel__body">
          <div class="${o.listClass}">
            ${commands.map((c, i) => o.render(c, i)).join('')}
          </div>
        </div>`

      const bodyNarrow = (o) => `
        <div class="panel__body">
          <div class="${o.listClass}">
            ${commands.slice(0, 4).map((c) => o.render(c, 0)).join('')}
          </div>
        </div>`

      document.getElementById('options').innerHTML = options
        .map(
          (o) => `
        <section class="opt">
          <div class="opt__meta">
            <span class="opt__tag">${o.tag}</span>
            <h2 class="opt__name">${o.name}</h2>
            <p class="opt__note">${o.note}</p>
          </div>
          <ul class="opt__list">
            ${o.plus.map((t) => `<li><span class="plus">＋</span> ${t}</li>`).join('')}
            ${o.minus.map((t) => `<li><span class="minus">−</span> ${t}</li>`).join('')}
          </ul>

          <div class="opt__stage" style="margin-top: 14px">
            <div class="stage__col">
              <div class="panel panel--wide">
                <div class="panel__head"><span class="eyebrow">命令</span></div>
                <button class="panel__add" type="button" aria-label="添加命令">${I.plus}</button>
                ${body(o)}
              </div>
              <p class="panel__cap">你现在的布局：中间栏 690 × 138 —— ${o.wideCap}</p>
            </div>

            <div class="stage__col">
              <div class="panel panel--narrow">
                <div class="panel__head"><span class="eyebrow">命令</span></div>
                <button class="panel__add" type="button" aria-label="添加命令">${I.plus}</button>
                ${bodyNarrow(o)}
              </div>
              <p class="panel__cap">窄栏 300 × 232 —— ${o.narrowCap}</p>
            </div>
          </div>
        </section>`
        )
        .join('')

      document.getElementById('toggle').addEventListener('click', () => {
        const root = document.documentElement
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'
      })
    </script>
  </body>
</html>
