<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      独立 Markdown 编辑窗口的入口（第六个 HTML 入口，见 docs/modules/notes.md）。

      与截图 / 钉图 / 网速球 / 独立视频窗口同一条口径：独立窗口、各自的 JS 上下文，
      只装适配层，**不装 store、不 initState** —— 它打开的是资源管理器里被右击的那一个
      .md 文件，路径与正文由 Rust 会话交过来（markdown_window_context），装 store 会与
      主窗口抢着读写同一批数据文件。

      明暗不写死：入口里 applyBootstrapTheme() 按首屏快照把 data-theme / .dark 落到
      <html> 上，tokens.css 随之切换；窗口在页面加载完成前一直藏着，不会闪白。
    -->
    <title>Markdown</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body,
      #markdown-window {
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        overflow: hidden;
        font-family: var(--font-ui);
        font-size: var(--fs-body);
        color: var(--ink-1);
        background: var(--bg-canvas);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      button {
        font-family: inherit;
      }

      /**
       * 拖大纲栏左缘：指针会扫过正文（Vditor 里是可选中文字），光标与文本选择
       * 只能在 body 上兜住 —— 这扇窗没引 global.css，笔记页那条 body 规则不在。
       */
      body.is-resizing-md-rail,
      body.is-resizing-md-rail * {
        cursor: ew-resize !important;
        user-select: none !important;
      }

      /**
       * Vditor 的图标 sprite：它由 `public/vditor/dist/js/icons/ant.js` 用
       * `document.body.insertAdjacentHTML('afterbegin', '<svg style="position: absolute; width: 0;
       * height: 0; overflow: hidden">…')` 插到 body 最前面，靠的是**行内 style**。
       *
       * 这扇窗的 HTML 里有这段内联 <style>，生产态 Tauri 会给它加 nonce，并在 CSP 的
       * `style-src` 里追加 `'nonce-…'` —— 按 CSP 规则，nonce 一在场 `'unsafe-inline'` 就失效，
       * **行内 style 属性整个被丢弃**，那个 sprite 于是按 SVG 的默认尺寸占成 300×150 的
       * inline 元素，把整扇窗往下顶 153px（现象就是正文上方一块白）。
       *
       * 所以这里用页面自己的样式把尺寸补回来（这段 <style> 带 nonce，是生效的）。
       * 只认 body 的直接子元素：正文里的 svg 与 Vditor 图片查看器里那些都不受影响。
       */
      body > svg {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="markdown-window"></div>
    <script type="module" src="/src/markdown-window/main.ts"></script>
  </body>
</html>
