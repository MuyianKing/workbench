[package]
name = "workbench"
version = "0.1.0"
description = "前端项目控制台"
authors = ["muyian"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：工作区背景图由 webview 按文件直接加载（asset 协议），
# 不再由我们在 Rust 里解码 / 缩放 / 编码成 data URL（见 commands.rs 的 allow_background）
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
zstd = "0.14"
# 图片解码：现在只剩「内置壁纸的缩略图」用到（背景图已改走 asset 协议，不再过这里）
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
uuid = { version = "1", features = ["v4"] }
# 下面这几个**全部已经在编译图里**（分别由 tauri / tao / wry / tauri-utils 引入），
# 直接依赖它们只是把已有的实现用起来，不新增任何编译单元：
#   - url / percent-encoding / form_urlencoded：URL 拆分与百分号编解码（oauth.rs）
#   - walkdir：递归列目录（token.rs）
#   - base64（tauri-codegen 已在构建期编译过，运行时是新进二进制的几 KB）：base64 编解码
#   - sha2：SHA-256 —— 手写密码学不值得，PKCE 的 code_challenge 走它
#   - flate2：解技能包的 deflate（pi_skills.rs）—— 它在图里是 image → png → flate2
url = "2"
percent-encoding = "2"
form_urlencoded = "1"
walkdir = "2"
base64 = "0.23"
sha2 = "0.11"
flate2 = "1"
# 邮箱（mail.rs）：IMAP 收信与 SMTP 发信要的是「TCP 流 + 隐式 TLS」，http.rs 那套
# WinHTTP 封装是 HTTP 专用，用不上。schannel 是系统自带 TLS 的纯 FFI 封装（无 C 编译、
# 无 build script），证书校验交给 Windows —— 唯一依赖 windows-sys ^0.61 与上面同一份，
# 只新增这一个编译单元；IMAP/SMTP 协议子集是手写的（rust-imap 不支持网易强制的 ID 命令）。
schannel = "0.1"
# 图标抽取直接走 Win32（PrivateExtractIconsW + GDI），不再依赖 PowerShell；
# Shell / Shell_Common / Storage_FileSystem 是为了 SHGetFileInfoW 与 SHGetPathFromIDListW ——
# 快捷方式自己不带图标资源，得先靠它们解析到目标程序（见 icon.rs）。
# WinHttp 与 Security_Credentials 是账号登录用的：HTTPS 走系统自带的 WinHTTP（TLS 与
# 系统代理都由 Windows 提供），access_token 走 Windows 凭据管理器（DPAPI 加密）。
# IpHelper / WinSock 是端口查询用的：按端口找占用进程走 GetExtendedTcpTable，
# 不再 shell 出去解析 netstat 的文本输出（见 system.rs）。
# Globalization 只有一处用：解技能包时把**没带 UTF-8 标志**的条目名按系统 ANSI
# （中文机器上就是 GBK）解出来（MultiByteToWideChar，见 pi_skills.rs）。
# Security / Security_Authentication_Identity 是保险库解锁那一步的：本机账户密码交给
# Windows 自己认（LogonUserW，advapi32），账户名与域来自 GetUserNameExW（secur32）——
# 与其余几行同一条口径，只是给 windows-sys 加 feature，不引账户管理 / 密码学 crate（见 vault.rs）。
# 这些路都只给已有依赖加 feature，**不新增任何 crate**。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# 保险库解锁优先走 Windows Hello（UserConsentVerifier，WinRT）：微软账户的机器上
# LogonUserW 那条路验不了登录密码 —— 密码由微软云端认，本机 SAM 里只有一份对不上的内部副本，
# Hello 验的才是登录界面实际用的那个凭据（见 vault.rs）。
# Security_Credentials_UI 是 UserConsentVerifier 本体；Win32_System_WinRT + Win32_Foundation
# 是 IUserConsentVerifierInterop 与 HWND —— 弹验证框必须走带 HWND 的 interop（钉在应用窗口上），
# 不带窗口的那条会把验证框压在主窗口后面，用户只当没弹出来。
# 邮件后台监视的系统通知（notify.rs）也走这条路：toast 是 WinRT 的 Windows.UI.Notifications
# （配 Data_Xml_Dom 拼通知的 XML），dev / 便携运行时没有安装器代建的快捷方式，
# 用 IShellLinkW + IPropertyStore 自己建一条带 AppUserModelID 的（COM 在 Win32_System_Com /
# Com_StructuredStorage / UI_Shell / UI_Shell_PropertiesSystem）。这几个 feature 有的是
# tao 那边已经并集进来的，添进来只是把用到的显式列出 —— 仍是同一个 crate、不新增编译单元。
# windows / windows-future 都已在编译图里（tao → windows 0.62 → windows-future 0.3，
# windows-future 不被 windows 转出口所以要单列）—— 只把已有的实现用起来，不新增编译单元。
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Security_Credentials_UI",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Variant",
] }
windows-future = "0.3"

# 开发档位：只留行号级调试信息。Windows 上链接时间的大头就是调试信息，
# 这一条直接决定改一行之后要等多久（见 docs/dev-notes/build-performance.md）。
[profile.dev]
debug = "line-tables-only"

# 发布档位：体积与编译耗时折中。strip 与 panic=abort 保住体积大头；
# LTO 取 thin 而非 fat —— fat LTO 会把整张调用图压进单个 codegen 单元，
# 单线程跑完要 3 分钟，且改任何一行 Rust 都要整份重付（实测见
# docs/dev-notes/build-performance.md）。
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
