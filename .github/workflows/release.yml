# 发版：push 一个 tag（`v0.2.0` 这种）→ 先过闸（typecheck + 单元测试）→ 再打 Windows x64 的 NSIS 安装包
# → 建 Release 并把安装包挂上去。日常提交不触发（只认 tag）。
#
# 几条约定：
#
# - **版本号先进仓库，tag 打在那一笔上**：先 `pnpm run bump <版本>` 把版本写进根 `package.json`、
#   `apps/desktop/package.json`、`apps/desktop/src-tauri/tauri.conf.json`、那份 `Cargo.toml` 与
#   `Cargo.lock` 里 workbench 那条（`packages/*` 是私有子包，统一钉 `0.0.0`、不参与版本），
#   同时把 `CHANGELOG.md` 的 `## [未发布]` 升成 `## [<版本>] - <日期>`；单独提交一笔，再打 tag。
#   流水线只**校验**（`scripts/bump-version.mjs --check`）：tag 与那几处对不上、或 CHANGELOG 里这一版
#   那一节空着，都停在这儿、提示先跑 bump —— 不在这里替谁改文件。这样 clone 这个 tag 出来就是那个
#   版本，本地 `pnpm run dist` 打出的包名与发布包一致（早先是构建时在 runner 工作区里写、不提交，
#   结果 v0.2.0 发出来了、仓库里还写着 0.1.0，本地重打得同名同版本的 0.1.0 包）。
# - **账号登录的 OAuth 凭据**从仓库 Secret `OAUTH_LOCAL_JSON` 注入：内容就是本机那份
#   `apps/desktop/src-tauri/oauth.local.json` 的原文（形状见同目录 `oauth.example.json`）。
#   没配这个 Secret 也能构建，只是发布包里登录按钮显示「未内置凭据」—— 与本地缺凭据时同一个行为。
# - **代码签名走 SignPath Foundation**（面向开源项目的免费 OV 级签名，私钥在它的 HSM 里、不需要
#   USB 令牌，所以能用在 CI 上）。**配置齐全才生效，没配就整段跳过、照旧发未签名的包** —— 与上面
#   OAuth 那段同一个思路：缺配置降级，不挡发布；配了 token 却缺变量则直接停下报错。要开的项：
#   仓库 Variable `SIGNPATH_ORGANIZATION_ID` / `SIGNPATH_PROJECT_SLUG` / `SIGNPATH_SIGNING_POLICY_SLUG`
#   / `SIGNPATH_ARTIFACT_CONFIGURATION_SLUG`，加 Secret `SIGNPATH_API_TOKEN`（四个 slug/id 不是秘密，
#   放 Variables；token 才是 Secret）。
#   签的是**安装包本身** —— 用户下载并运行的就是那颗 exe，SmartScreen 看的就是它。包里的
#   `workbench.exe` 仍是未签名的：它装到本地后不带 MOTW，不会触发 SmartScreen；要连它一起签，得把
#   构建拆成「先 `tauri build --no-bundle` 签 exe、再单独打 NSIS」两步，目前没做。
#   SignPath 侧一次性的活：① signpath.org/apply 申请 Foundation（说明是开源项目、给仓库地址）
#   → ② 建 Project 关联这个 GitHub 仓库 + 装 SignPath GitHub App 并授权 → ③ 建 Signing Policy
#   （Open Source Code Signing）→ ④ 建 Artifact Configuration，根元素按「不压 zip 的单 PE 文件」写：
#     <artifact-configuration xmlns="http://signpath.io/artifact-configuration/v1">
#       <pe-file path="*.exe"><authenticode-sign /></pe-file>
#     </artifact-configuration>
#   Foundation 的两条硬要求：签名请求之前的**所有 job 都跑在 GitHub 托管的 runner 上**（本文件本来
#   就是 windows-latest，符合），产物要**先作为 workflow artifact 上传到 GitHub**、由它自己去取。
# - **只出 Windows x64**：runner 是 x64 的 `windows-latest`，不传 `--target`，产物固定落在
#   `apps/desktop/src-tauri/target/release/bundle/nsis/` 下那一颗 `*_x64-setup.exe`（配置见
#   `tauri.conf.json` 的 `bundle.targets = ["nsis"]`）。
# - **Release 正文**＝ `CHANGELOG.md` 里这一版那一节（`--notes` 取出来的那份，随校验一起要求非空）
#   ＋ GitHub 自动生成的「**Full Changelog**: …/compare/上一个 tag...这个 tag」那段（用 release-notes
#   那个 API 自己取，理由见步骤里的注释）。tag 带预发布后缀（`v0.2.0-rc.1`）时标成 prerelease；
#   同一个 tag 重跑：不重复建，改成更新已有那条的正文并覆盖附件。
# - 版本号只认 `vX.Y.Z`（可带 `-rc.1` 这类后缀）；tag 与仓库里那几处对不上，就在版本校验那一步停下
#   （故意放在装 Rust / 编依赖之前：打错 tag 是最常见的失手，不该等十几分钟才知道）。

name: 发布 Release

on:
  push:
    tags:
      - 'v*'

# 同一个 tag 只允许一轮在跑：失败后重跑不打乱先后，也不会有两次构建同时往一个 Release 上挂附件
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: 校验（typecheck + 测试）
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # 版本读根 package.json 的 packageManager（单一来源，不在这儿再钉一遍）。
      # 要 v6：v4 是 node20 那批，GitHub 会以「Node.js 20 is deprecated」把它强制跑在 node24 上；
      # v6 的 using 就是 node24，且省掉 version 的前提是 packageManager 里的 pnpm ≥ 11（这里是 12.5.1）
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 单元测试
        run: pnpm test

  release:
    name: 打包并发布（Windows x64）
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
      # 签名那几步要把未签名的包装成 workflow artifact 交给 SignPath，并读 job 详情；
      # 显式写了 permissions 之后未列出的权限就都是 none，所以这条得单独放行
      actions: read
    # token 提到 job 级：步级的 `if` 读不到 secrets，只能靠这个 env 判断「这次要不要签」
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      # 版本读根 package.json 的 packageManager（单一来源，不在这儿再钉一遍）—— 同 verify job，要 v6
      - uses: pnpm/action-setup@v6

      # Node 24 与开发机一致（内置的 Pi 要 ≥ 22.19，门槛判定在 packages/ai/src/ai.ts）
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # 版本校验放在装 Rust / 编依赖之前：打错 tag 是最常见的失手，不该等十几分钟才知道
      - name: 从 tag 取版本
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::tag 必须是 vX.Y.Z 形式（可带预发布后缀，如 v0.2.0-rc.1），当前是 $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          case "$VERSION" in
            *-*) echo "PRERELEASE=1" >> "$GITHUB_ENV" ;;
          esac
          echo "$TAG → 版本 $VERSION"

      # 版本号与 CHANGELOG 都该由 bump 脚本先写进仓库并提交（见文件头第 1 条），这里只对账、不改文件：
      # tag 与那几处版本字段、`packages/*` 钉 0.0.0、以及 CHANGELOG 里这一版那一节有没有条目，
      # 全都收在一处判断（scripts/bump-version.mjs）
      - name: 校验仓库版本字段与 CHANGELOG 和 tag 一致
        shell: bash
        run: node scripts/bump-version.mjs --check "$VERSION"

      - name: 装 Rust（stable + x86_64-pc-windows-msvc）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Tauri 那棵依赖树第一次编要十几分钟，靠它把 target/ 与 registry 缓存住
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: 装依赖
        run: pnpm install --frozen-lockfile

      - name: 注入 OAuth 凭据（Secret OAUTH_LOCAL_JSON；没配就退回空模板）
        shell: bash
        env:
          OAUTH_LOCAL_JSON: ${{ secrets.OAUTH_LOCAL_JSON }}
        run: |
          if [ -z "$OAUTH_LOCAL_JSON" ]; then
            echo "::warning::仓库里没有 OAUTH_LOCAL_JSON 这个 Secret，本次发布的包里账号登录会显示「未内置凭据」"
            exit 0
          fi
          printf '%s\n' "$OAUTH_LOCAL_JSON" > apps/desktop/src-tauri/oauth.local.json
          node -e 'JSON.parse(require("fs").readFileSync("apps/desktop/src-tauri/oauth.local.json", "utf8"))' \
            || { echo "::error::OAUTH_LOCAL_JSON 不是合法 JSON（内容应当就是本机 oauth.local.json 的原文）"; exit 1; }
          echo "已注入 OAuth 凭据"

      # beforeBuildCommand 会自己跑 build:renderer；这条 = vendor-pi.mjs（内置 Pi）+ tauri build
      - name: 打包（NSIS，Windows x64）
        run: pnpm run dist

      # ---- 代码签名（SignPath Foundation）-------------------------------------------------
      # 没配 SIGNPATH_API_TOKEN 时下面四步全跳过，照旧发未签名的包（缺配置降级、不挡发布）
      - name: 校验签名配置齐全
        if: env.SIGNPATH_API_TOKEN != ''
        shell: bash
        env:
          ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          missing=()
          [ -n "$ORGANIZATION_ID" ]             || missing+=(SIGNPATH_ORGANIZATION_ID)
          [ -n "$PROJECT_SLUG" ]                || missing+=(SIGNPATH_PROJECT_SLUG)
          [ -n "$SIGNING_POLICY_SLUG" ]         || missing+=(SIGNPATH_SIGNING_POLICY_SLUG)
          [ -n "$ARTIFACT_CONFIGURATION_SLUG" ] || missing+=(SIGNPATH_ARTIFACT_CONFIGURATION_SLUG)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::配了 SIGNPATH_API_TOKEN，但还缺这些仓库 Variables：${missing[*]}（Settings → Secrets and variables → Actions → Variables；配置清单见本文件头部）"
            exit 1
          fi
          echo "签名配置齐全，这次的安装包会送签"

      # SignPath 只签「先作为 workflow artifact 传到 GitHub 上」的产物，它自己去取
      - name: 上传未签名安装包（供 SignPath 拉取）
        if: env.SIGNPATH_API_TOKEN != ''
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-nsis
          # 不压 zip：这样 Artifact Configuration 的根元素可以直接是 <pe-file>（见文件头）
          archive: false
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 提交签名请求并取回签名后的安装包
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # 与上面 archive: false 配对，别再解一次压
          skip-decompress: true
          output-artifact-directory: ${{ runner.temp }}/signed

      # 就地把未签名的包换掉：下面「建 Release」那步照旧 glob 这个目录，它不用改
      - name: 用签名后的包替换，并校验签名
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem -Path "$env:RUNNER_TEMP/signed" -Filter *.exe -Recurse -ErrorAction SilentlyContinue)
          if ($signed.Count -eq 0) {
            Write-Error "$env:RUNNER_TEMP/signed 下没有 .exe —— 签名没成功，不发未签名的包"
            exit 1
          }
          $dest = Join-Path 'apps/desktop/src-tauri/target/release/bundle/nsis' $signed[0].Name
          Copy-Item -LiteralPath $signed[0].FullName -Destination $dest -Force
          $sig = Get-AuthenticodeSignature -LiteralPath $dest
          Write-Host "签名状态: $($sig.Status)"
          Write-Host "签名者:   $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') {
            Write-Error "签名校验没通过：$($sig.Status) $($sig.StatusMessage)"
            exit 1
          }
          Get-Item -LiteralPath $dest | Format-List Name, Length, LastWriteTime

      - name: 建 Release 并挂上安装包
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          installers=(apps/desktop/src-tauri/target/release/bundle/nsis/*.exe)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "::error::target/release/bundle/nsis 下没有 .exe，安装包没打出来"
            exit 1
          fi
          ls -lh "${installers[@]}"
          # 正文 = CHANGELOG.md 里这一版那一节（--check 已经确认过非空）+ GitHub 自动生成的
          # 「**Full Changelog**: …/compare/上一个 tag...这个 tag」那段。后者本来是 `--generate-notes`
          # 给的，但 `gh release edit` 没有这个旗标 —— 用同一个 API 自己取一次，建与重跑才喂同一份正文。
          # 中间留一个空行：不留的话那行加粗字会被 markdown 并进上面最后一条列表项里。
          notes="$RUNNER_TEMP/release-notes.md"
          node scripts/bump-version.mjs --notes "$VERSION" > "$notes"
          printf '\n' >> "$notes"
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" --jq .body >> "$notes"
          cat "$notes"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG 已存在：更新正文（含刚生成的那段）、覆盖附件"
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --notes-file "$notes"
            gh release upload "$TAG" "${installers[@]}" -R "$GITHUB_REPOSITORY" --clobber
          else
            args=(--title "Workbench $TAG" --notes-file "$notes")
            if [ -n "$PRERELEASE" ]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${installers[@]}" -R "$GITHUB_REPOSITORY" "${args[@]}"
          fi
