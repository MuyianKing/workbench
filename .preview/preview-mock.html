    <!-- PREVIEW-ONLY: 在浏览器里跑渲染层时用来顶替 electron preload 暴露的 API，截图后会删除 -->
    <script>
      ;(function () {
       try {
        const now = Date.now()
        const make = (i, name) => ({
          id: 'p' + i,
          name,
          path: 'F:/projects/' + name,
          packageManager: 'auto',
          detectedPackageManager: 'npm',
          framework: 'Vue 3',
          version: '1.0.0',
          scripts: { serve: 'dev', build: ['build'], defaultBuild: 'build' },
          autoOpenExplorer: false,
          order: i,
          createdAt: now - i * 86400000,
          lastUsedAt: now - i * 3600000
        })

        const params = new URLSearchParams(location.search)

        // PREVIEW-ONLY: 内置壁纸，与 resources/backgrounds 保持一致（截图前会把原图拷进 dist）
        const WALLPAPER_FILES = [
          '万重山.jpg',
          '二次元美女.jpg',
          '云雾.jpg',
          '五星红旗.jpg',
          '好运发生-福.jpg',
          '小兰.jpg',
          '橘子洲头.jpg'
        ]
        const idOf = (file) => file.replace(/\.[^.]+$/, '')

        function loadImage(src) {
          return new Promise((resolve, reject) => {
            const img = new Image()
            img.onload = () => resolve(img)
            img.onerror = () => reject(new Error('加载失败：' + src))
            img.src = src
          })
        }

        /** 缩略图：跟主进程一样压到 360 宽，别拿几兆的原图铺设置面板 */
        function thumbnailOf(img) {
          const canvas = document.createElement('canvas')
          canvas.width = 360
          canvas.height = Math.round((img.height / img.width) * 360)
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height)
          return canvas.toDataURL('image/jpeg', 0.72)
        }

        /** 背景图：主进程那条链路是「解码 → 缩放到 1920 → JPEG(q82)」，这里照抄一遍 */
        function backgroundOf(img) {
          const canvas = document.createElement('canvas')
          const scale = Math.min(1, 1920 / img.width)
          canvas.width = Math.round(img.width * scale)
          canvas.height = Math.round(img.height * scale)
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height)
          return canvas.toDataURL('image/jpeg', 0.82)
        }

        async function listWallpapers() {
          const out = []
          for (const file of WALLPAPER_FILES) {
            let img
            try {
              img = await loadImage('wallpapers/' + file)
            } catch {
              // 缺图就跳过这张，别整条抛错：真机的 listWallpapers 是扫目录，缺图只是少一块。
              // 预览里一旦抛错会让 loadData 半路中断 —— 表现是「主题 / 设置全都不生效」，
              // 查起来完全不像是少了一张壁纸。
              continue
            }
            out.push({
              id: idOf(file),
              name: file,
              reference: 'builtin:' + idOf(file),
              thumbnail: thumbnailOf(img)
            })
          }
          return out
        }

        // ?wall=五星红旗.jpg 时把这张内置壁纸当作当前背景；?local=1 时假装设了一张磁盘上的自选图
        const wallFile = params.get('wall') ? decodeURIComponent(params.get('wall')) : ''
        const localPick = params.get('local') === '1'

        const settings = {
          launchAtLogin: false,
          theme: params.get('dark') === '1' ? 'dark' : 'light',
          hotkeyEnabled: true,
          hotkey: 'Control+Shift+W',
          minimizeToTray: false,
          terminalHeight: 288,
          sidePanelWidth: 340,
          // PREVIEW-ONLY: ?side=left|right 切侧栏在哪一侧，一次截图一种摆法
          sidePanelPosition: params.get('side') || 'right',
          workspaceBackground: localPick
            ? 'D:/pics/我的图.jpg'
            : wallFile
              ? 'builtin:' + idOf(wallFile)
              : '',
          workspaceBackgroundOpacity: Number(params.get('op') || 40),
          workspaceBackgroundVeil: params.get('veil') || '',
          // PREVIEW-ONLY: ?accent=2f6bd8 指定主题色（可带 # 也可不带）
          accentColor: params.get('accent')
            ? '#' + params.get('accent').replace(/^#/, '')
            : '',
          // PREVIEW-ONLY: ?accentInk=auto|white|dark 指定主题色上的文字取法
          accentInk: params.get('accentInk') || 'auto',
          // PREVIEW-ONLY: ?top=band|glass|clear 一次截图一种顶部样式
          topBarStyle: params.get('top') || 'band'
        }

        // PREVIEW-ONLY: 快捷启动的假数据。图标由 canvas 现画（真机上是系统图标），
        // 故意留一个没有图标的（走首字母兜底）和一个路径失效的
        // 画成圆角块而不是整块填满：真实图标多数是透明底的，
        // 这样一眼能看出卡片有没有给图标垫一块多余的白底
        function fakeIcon(letter, bg) {
          const canvas = document.createElement('canvas')
          canvas.width = 32
          canvas.height = 32
          const ctx = canvas.getContext('2d')
          ctx.fillStyle = bg
          ctx.beginPath()
          ctx.roundRect(3, 3, 26, 26, 7)
          ctx.fill()
          ctx.fillStyle = '#fff'
          ctx.font = 'bold 16px system-ui, sans-serif'
          ctx.textAlign = 'center'
          ctx.textBaseline = 'middle'
          ctx.fillText(letter, 16, 17)
          return canvas.toDataURL('image/png')
        }

        // ?quickMany=1 时铺满 20 个，用来检查换行与面板内部滚动
        const QUICK_NAMES = [
          'Visual Studio Code', 'Chrome', '微信', 'Postman', 'Figma', 'Typora',
          'Notion', 'Slack', '钉钉', 'Docker Desktop', 'Xshell', 'Navicat',
          'Redis Insight', 'WPS Office', 'PotPlayer', 'Everything', 'Bandizip',
          'Snipaste', 'DBeaver', 'GitHub Desktop'
        ]

        const quickAll = QUICK_NAMES.map((name, i) => ({
          id: 'q' + (i + 1),
          name,
          target: 'C:/Program Files/' + name + '/' + name.split(' ')[0] + '.exe',
          args: name === 'Typora' ? '--new' : undefined,
          order: i,
          createdAt: now
        }))

        const quickApps = params.get('quickMany') === '1' ? quickAll : quickAll.slice(0, 6)
        // 第 5 个当作路径失效，Postman 故意不给图标（走首字母兜底）
        quickApps[4].target = 'D:/old/Figma/Figma.exe'

        const quickIcons = {
          'C:/Program Files/Visual Studio Code/Visual.exe': fakeIcon('V', '#0b7bd4'),
          'C:/Program Files/Chrome/Chrome.exe': fakeIcon('C', '#e0653a'),
          'C:/Program Files/微信/微信.exe': fakeIcon('微', '#1aad19'),
          'C:/Program Files/Typora/Typora.exe': fakeIcon('T', '#4a4f57')
        }

        // PREVIEW-ONLY: 首页布局（theme.json）的假数据，与 shared/theme.ts 的默认布局一致
        const themeConfig = {
          version: 1,
          gridStep: 2,
          leftWidth: 320,
          rightWidth: 300,
          cards: {
            activity: { column: 'left', order: 0, mode: 'fixed', height: 200 },
            system: { column: 'left', order: 1, mode: 'flex', height: 184 },
            recent: { column: 'right', order: 0, mode: 'fixed', height: 222 },
            actions: { column: 'right', order: 1, mode: 'flex', height: 180 },
            quick: { column: 'center', order: 0, mode: 'fixed', height: 176 },
            projects: { column: 'center', order: 1, mode: 'flex', height: 600 }
          }
        }

        // PREVIEW-ONLY: ?centerOnly=1 把六块全放中栏，用来验证「空栏平时不显示 / 编辑时才显示」
        if (params.get('centerOnly') === '1') {
          Object.keys(themeConfig.cards).forEach((id, i) => {
            themeConfig.cards[id] = { column: 'center', order: i, mode: 'fixed', height: 150 }
          })
        }

        const data = {
          listProjects: {
            projects:
              params.get('empty') === '1'
                ? []
                : [
                    make(1, 'admin-web'),
                    make(2, 'mobile-h5'),
                    make(3, 'data-dashboard'),
                    make(4, 'landing-page'),
                    make(5, 'mini-program'),
                    make(6, 'component-lib'),
                    make(7, 'docs-site'),
                    make(8, 'design-tokens')
                  ],
            groups: []
          },
          getSettings: settings,
          getDataLocation: {
            dir: 'C:/Users/me/AppData/Roaming/workbench',
            file: 'workbench-data.json',
            isDefault: true
          },
          // PREVIEW-ONLY: 自绘标题栏的窗口状态。浏览器里没有真窗口，用 ?maxed=1 切「已最大化」，
          // 方便看第三个按钮画的是方框还是叠框
          getWindowState: { maximized: params.get('maxed') === '1' },
          getActivity: {},
          checkPackageManagers: { npm: true, yarn: true, pnpm: false, node: 'v20.11.0' },
          getNvmStatus: {
            available: true,
            root: 'C:/nvm',
            symlink: 'C:/nodejs',
            current: '20.11.0',
            versions: ['20.11.0', '18.20.4']
          },
          listQuickApps: {
            // ?quick=0 时当作一个常用软件都没加，看空状态
            apps: params.get('quick') === '0' ? [] : quickApps,
            missing: params.get('quick') === '0' ? {} : { q5: true }
          },
          checkProjectPaths: {},
          reveal: { ok: true },
          checkPort: { port: 0, inUse: false },
          getNodeVersion: { required: undefined, actual: '20.11.0', source: 'system', ok: true },
          launchQuickApp: { ok: true },
          getThemeConfig: themeConfig
        }

        const clone = (value) => JSON.parse(JSON.stringify(value))

        window.workbench = new Proxy(
          {
            platform: 'win32',
            versions: { electron: '33.4.11', node: '20.11.0', chrome: '130.0.6723.44' }
          },
          {
            get(target, prop) {
              if (prop in target) return target[prop]
              if (prop === 'listWallpapers') return () => listWallpapers()
              // 布局保存：像主进程那样把 patch 合并进去再回传，否则界面会「拖完弹回去」
              if (prop === 'updateThemeConfig') {
                return async (patch) => {
                  Object.assign(themeConfig, patch, {
                    cards: { ...themeConfig.cards, ...((patch && patch.cards) || {}) }
                  })
                  return { ok: true, data: clone(themeConfig) }
                }
              }
              // 设置保存：真合并补丁再回传，否则界面上改了设置会立刻弹回去。
              // 必须在这里显式处理：下面那条通用分支会把函数值 clone 掉（JSON 里没有函数），
              // 走到那儿就成了「clone(undefined)」直接抛错，改了设置看起来毫无反应。
              if (prop === 'updateSettings') {
                return async (patch) => {
                  Object.assign(settings, patch)
                  return { ok: true, data: clone(settings) }
                }
              }
              if (prop === 'quickAppIcon') {
                return async (target) =>
                  quickIcons[target]
                    ? { ok: true, data: quickIcons[target] }
                    : { ok: false, error: '取不到图标（预览）' }
              }
              if (prop === 'loadBackground') {
                return async (ref) => {
                  const builtin = /^builtin:/.test(String(ref))
                  const file = builtin
                    ? String(ref).replace(/^builtin:/, '') + '.jpg'
                    : WALLPAPER_FILES[0]
                  const img = await loadImage('wallpapers/' + file)
                  return {
                    ok: true,
                    data: {
                      path: ref,
                      name: builtin ? file : '我的图.jpg',
                      dataUrl: backgroundOf(img)
                    }
                  }
                }
              }
              // PREVIEW-ONLY: 退出确认框。订阅时把处理函数存起来，?quit=1 时手动触发；
              // 回传的选择只记下来，预览里不真退。
              if (prop === 'onQuitConfirm') {
                return (fn) => {
                  window.__quitHandler = fn
                  return () => {
                    window.__quitHandler = null
                  }
                }
              }
              if (prop === 'respondQuitConfirm') {
                return (choice) => {
                  window.__quitChoice = choice
                }
              }
              if (prop in data) return () => Promise.resolve(clone(data[prop]))
              // 其余（事件订阅等）统一返回一个 unsubscribe
              return () => () => {}
            }
          }
        )

        // PREVIEW-ONLY: ?quickDialog=1 打开「添加常用软件」；=edit 再点开第一张卡的「⋯ → 编辑…」
        if (params.get('quickDialog') === '1') {
          setTimeout(() => document.querySelector('.launch__item--add')?.click(), 1200)
        } else if (params.get('quickDialog') === 'edit') {
          setTimeout(() => {
            document.querySelector('.launch__item .launch__more-btn')?.click()
            setTimeout(() => {
              const items = [...document.querySelectorAll('.el-dropdown-menu__item')]
              const edit = items.find((el) => el.textContent.includes('编辑'))
              if (edit) edit.click()
            }, 600)
          }, 1200)
        }

        // PREVIEW-ONLY: ?quit=1 弹出退出确认框；?quitCount=N 控制项目数
        if (params.get('quit') === '1') {
          const fire = (attempt) => {
            if (typeof window.__quitHandler === 'function') {
              window.__quitHandler({ count: Number(params.get('quitCount') || 2) })
            } else if (attempt < 40) {
              setTimeout(() => fire(attempt + 1), 100)
            }
          }
          setTimeout(() => fire(0), 1200)
        }

        // PREVIEW-ONLY: ?settings=1 打开设置弹窗，方便截图看背景那一栏
        if (params.get('settings') === '1') {
          setTimeout(() => {
            document.querySelector('[aria-label="系统配置"]')?.click()
          }, 1200)
        }

        // PREVIEW-ONLY: ?layoutEdit=1 进入首页布局编辑态（设置 → 首页布局 → 进入编辑）
        if (params.get('layoutEdit') === '1') {
          setTimeout(() => {
            document.querySelector('[aria-label="系统配置"]')?.click()
            setTimeout(() => {
              const buttons = [...document.querySelectorAll('.el-dialog button')]
              const enter = buttons.find((el) => el.textContent.includes('进入编辑'))
              if (enter) enter.click()
            }, 700)
          }, 1200)
        }

        // PREVIEW-ONLY: 截图前滚到底部，方便看右栏最下面那块面板
        if (params.get('scroll') === '1') {
          setTimeout(() => {
            const home = document.querySelector('.home')
            if (home) home.scrollTop = home.scrollHeight
          }, 1200)
        }
       } catch (err) {
        // PREVIEW-ONLY: mock 挂了要看得见，否则界面只会静悄悄地停在空数据上
        window.__previewMockError = String((err && err.message) || err)
        document.title = 'MOCK-ERR: ' + window.__previewMockError
       }
      })()
    </script>
