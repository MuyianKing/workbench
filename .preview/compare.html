<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>快捷操作面板 · 改动对比</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #edeff2;
        font-family: system-ui, sans-serif;
        display: flex;
        gap: 20px;
        align-items: flex-start;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-bottom: 8px;
        font-size: 13px;
        color: #4e5866;
      }
      .crop {
        width: 520px;
        height: 330px;
        overflow: hidden;
        position: relative;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 1px 2px rgba(17, 21, 27, 0.12);
      }
      .crop img {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <figure>
      <figcaption>改动前：列表 → 分隔线 → 说明</figcaption>
      <div class="crop"><img src="app6.png" alt="改动前" /></div>
    </figure>
    <figure>
      <figcaption>改动后：说明紧贴列表</figcaption>
      <div class="crop"><img src="app8.png" alt="改动后" /></div>
    </figure>
  </body>
</html>
