<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>快捷操作面板 · 间距实测</title>
    <link rel="stylesheet" href="../src/renderer/src/styles/tokens.css" />
    <link rel="stylesheet" href="../src/renderer/src/styles/global.css" />
    <style>
      /* 复刻 HomePanels 的 .panels：单列、面板按内容高度 */
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg-canvas);
      }

      .panels {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
      }

      /* HomePanels.vue 的 scoped .tips__note 原样复制（实线 + 线贴最后一行、上内距 10px） */
      .tips__note {
        margin-top: calc(var(--sp-3) * -1 + 4px);
        padding: calc(var(--sp-2) + 2px) 0 0;
        border-top: 1px solid var(--border);
        font-size: var(--fs-micro);
        color: var(--ink-3);
      }

      /* 修改前：说明紧贴列表、没有分隔线 */
      .is-variant-a .tips__note {
        padding-top: 0;
        border-top: 0;
      }

      /* WelcomePanel.vue 空状态侧栏里的同名说明，验证两处是否一致 */
      .side__note {
        margin-top: 0;
        padding-top: var(--sp-1);
        border-top: 1px dashed var(--border);
        font-size: var(--fs-micro);
        color: var(--ink-3);
      }

      #snap {
        position: fixed;
        left: 0;
        bottom: 0;
        z-index: 9;
        margin: 0;
        padding: 6px 8px;
        background: #11151b;
        color: #fff;
        font: 11px/1.45 Consolas, monospace;
        white-space: pre;
      }

      html.snap-off #snap {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="panels" id="stage"></div>

    <pre id="snap"></pre>

    <script>
      const TIPS = [
        ['搜索项目名或路径', 'Ctrl K'],
        ['唤起 / 隐藏窗口', 'Control + Shift + W'],
        ['把卡片拖到分组标签即归类', '拖动'],
        ['拖动分组标签可调整顺序', '拖动'],
        ['点关闭按钮收进托盘，不会退出', '关闭']
      ]

      function markup() {
        return `
          <article class="panel" id="panel">
            <header class="panel__head">
              <span class="eyebrow">快捷操作</span>
            </header>
            <ul class="tips">
              ${TIPS.map(
                ([text, hint]) => `
                <li class="tip">
                  <span class="tip__text truncate" title="${text}">${text}</span>
                  <kbd class="tip__key mono">${hint}</kbd>
                </li>`
              ).join('')}
            </ul>
            <p class="tips__note" id="note">主题、托盘、开机自启在右上角的设置里。</p>
          </article>`
      }

      const params = new URLSearchParams(location.search)
      const variant = params.get('variant') || 'b'
      if (params.get('snap') === 'off') document.documentElement.classList.add('snap-off')

      const stage = document.getElementById('stage')
      stage.innerHTML = markup()
      /* 默认 b = 修改后；variant=a 复现修改前，用来做对比截图 */
      if (variant === 'a') stage.classList.add('is-variant-a')
      /* w=<px> 把面板收到指定宽度，用来检查空状态侧栏那种窄栏（272px）下的观感 */
      const w = params.get('w')
      if (w) stage.style.width = w + 'px'

      function box(el) {
        const r = el.getBoundingClientRect()
        const cs = getComputedStyle(el)
        return {
          top: +r.top.toFixed(1),
          bottom: +r.bottom.toFixed(1),
          left: +r.left.toFixed(1),
          right: +r.right.toFixed(1),
          h: +r.height.toFixed(1),
          mt: cs.marginTop,
          pt: cs.paddingTop,
          pb: cs.paddingBottom
        }
      }

      function measure() {
        const panel = document.getElementById('panel')
        const tips = [...panel.querySelectorAll('.tip')]
        const note = document.getElementById('note')
        const tipsBox = box(panel.querySelector('.tips'))
        const panelBox = box(panel)
        const noteBox = box(note)
        const lastBox = box(tips[tips.length - 1])
        const headBox = box(panel.querySelector('.panel__head'))

        const rows = tips.map((t, i) => {
          const b = box(t)
          return {
            i,
            text: t.textContent.trim().slice(0, 12),
            top: b.top,
            bottom: b.bottom,
            h: b.h
          }
        })

        const out = {
          variant,
          panel: panelBox,
          head: headBox,
          tips: tipsBox,
          rows,
          note: noteBox,
          gap_head_to_tips: +(tipsBox.top - headBox.bottom).toFixed(1),
          gap_tip_to_tip: +(rows[1].top - rows[0].bottom).toFixed(1),
          gap_last_tip_to_note: +(noteBox.top - lastBox.bottom).toFixed(1),
          note_bottom_to_panel_bottom: +(panelBox.bottom - noteBox.bottom).toFixed(1),
          pad_bottom: panelBox.pb
        }
        return out
      }

      function render() {
        document.getElementById('snap').textContent =
          'SNAP ' + JSON.stringify(measure(), null, 1) + ' ENDSNAP'
      }

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(render)
      } else {
        render()
      }
      addEventListener('load', render)
      setTimeout(render, 400)
    </script>
  </body>
</html>
